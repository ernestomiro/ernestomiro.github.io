<div class="language-switcher" role="group" [attr.aria-label]="accessibleGroupLabel()">
  @for (language of languages; track language) {
    <button
      type="button"
      [class.language-switcher__option--active]="currentLanguage() === language"
      [attr.aria-pressed]="currentLanguage() === language"
      (click)="select(language)"
    >
      {{ language.toUpperCase() }}
    </button>
  }
</div>
