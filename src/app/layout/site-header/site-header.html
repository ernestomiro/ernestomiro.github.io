<header #siteHeader class="site-header">
  <div class="layout-shell site-header__row">
    <a
      class="site-header__brand"
      routerLink="/"
      fragment="top"
      [queryParams]="homeQueryParams()"
      (click)="closeMenu()"
    >
      {{ label('identity') }}
    </a>

    <nav class="site-header__desktop-nav" [attr.aria-label]="label('navigation')">
      @for (item of navigation(); track item.id) {
        <a
          routerLink="/"
          [fragment]="item.id"
          [queryParams]="homeQueryParams()"
          [class.site-header__link--active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
        >
          {{ localize(item.label) }}
        </a>
      }

      <a
        class="site-header__resume"
        [href]="resume().href"
        [attr.download]="resume().fileName"
      >
        <span>{{ localize(resume().label) }}</span>
        <span aria-hidden="true">↓</span>
      </a>
    </nav>

    <div class="site-header__controls">
      <div class="site-header__desktop-preferences">
        <app-theme-switcher idPrefix="desktop-theme-switcher" />
        <app-language-switcher />
      </div>
      <button
        #menuButton
        type="button"
        class="site-header__menu-toggle"
        aria-controls="mobile-primary-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        {{ label('menu') }}
        <span aria-hidden="true">{{ menuOpen() ? '×' : '+' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      id="mobile-primary-navigation"
      class="site-header__mobile-nav"
    >
      <div class="layout-shell site-header__mobile-links">
        <nav
          class="site-header__mobile-primary-links"
          [attr.aria-label]="label('navigation')"
        >
          @for (item of navigation(); track item.id) {
            <a
              routerLink="/"
              [fragment]="item.id"
              [queryParams]="homeQueryParams()"
              [class.site-header__link--active]="activeSection() === item.id"
              [attr.aria-current]="activeSection() === item.id ? 'location' : null"
              (click)="closeMenu()"
            >
              {{ localize(item.label) }}
            </a>
          }
        </nav>

        <div
          class="site-header__mobile-preferences"
          role="group"
          [attr.aria-label]="label('preferences')"
        >
          <app-theme-switcher idPrefix="mobile-theme-switcher" />
          <app-language-switcher />
        </div>

        <a
          class="site-header__resume"
          [href]="resume().href"
          [attr.download]="resume().fileName"
          (click)="closeMenu()"
        >
          <span>{{ localize(resume().label) }}</span>
          <span aria-hidden="true">↓</span>
        </a>
      </div>
    </div>
  }
</header>
