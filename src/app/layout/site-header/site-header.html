<header #siteHeader>
  <div class="layout-shell r">
    <button
      #menuButton
      type="button"
      class="m"
      aria-controls="mobile-primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="label(menuOpen() ? 'closeMenu' : 'menu')"
      [class.o]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="g" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <a
      class="b"
      routerLink="/"
      fragment="top"
      [queryParams]="homeQueryParams()"
      (click)="closeMenu()"
    >
      <span class="i">{{ label('identity') }}</span>
    </a>

    <nav class="n" [attr.aria-label]="label('navigation')">
      @for (item of navigation(); track item.id) {
        <a
          routerLink="/"
          [fragment]="item.id"
          [queryParams]="homeQueryParams()"
          [class.a]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
        >
          {{ localize(item.label) }}
        </a>
      }
    </nav>

    <div class="c">
      <div class="p">
        <app-theme-switcher idPrefix="desktop-theme-switcher" />
        <app-language-switcher />
        <a
          class="cv"
          [href]="resume().href"
          [attr.download]="resume().fileName"
        >
          <span>{{ localize(resume().label) }}</span>
          <span aria-hidden="true">↓</span>
        </a>
      </div>
      <div class="l">
        <app-language-switcher />
      </div>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      id="mobile-primary-navigation"
      class="d"
    >
      <div class="layout-shell dc">
        <nav class="ds" [attr.aria-label]="label('navigation')">
          @for (item of navigation(); track item.id) {
            <a
              routerLink="/"
              [fragment]="item.id"
              [queryParams]="homeQueryParams()"
              [class.a]="activeSection() === item.id"
              [attr.aria-current]="activeSection() === item.id ? 'location' : null"
              (click)="closeMenu()"
            >
              {{ localize(item.label) }}
            </a>
          }
        </nav>

        <div class="ds s">
          <app-theme-switcher idPrefix="mobile-theme-switcher" />
          <a
            class="cv"
            [href]="resume().href"
            [attr.download]="resume().fileName"
            (click)="closeMenu()"
          >
            <span>{{ localize(resume().label) }}</span>
            <span aria-hidden="true">↓</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
