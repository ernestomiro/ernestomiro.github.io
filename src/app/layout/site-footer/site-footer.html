<footer class="site-footer page-reveal" appSectionReveal data-reveal-together>
  <div class="layout-shell site-footer__inner">
    <p class="site-footer__name" data-reveal-item>{{ content().name }}</p>

    <app-resume-download
      class="site-footer__resume"
      data-reveal-item
      [content]="content().resume"
      placement="above"
    />

    <p class="site-footer__copyright" data-reveal-item>
      © {{ currentYear }} {{ content().copyrightOwner }}
    </p>
  </div>
</footer>
