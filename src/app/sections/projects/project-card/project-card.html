<article class="project-card">
  <a
    class="project-card__link"
    [routerLink]="['/projects', project().slug]"
    [queryParams]="detailQueryParams()"
  >
    <div class="project-card__content">
      @if (project().period; as period) {
        <p class="project-card__period">{{ period }}</p>
      }
      <h3>{{ localize(project().title) }}</h3>
      <p class="project-card__role">{{ localize(project().role) }}</p>
      <p class="project-card__summary">{{ localize(project().summary) }}</p>
    </div>

    <span class="project-card__action">
      {{ actionLabel() }}
      <span aria-hidden="true">→</span>
    </span>
  </a>
</article>
