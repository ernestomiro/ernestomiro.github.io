<section
  id="artificial-intelligence"
  class="section section--collection section--chapter-member"
  aria-labelledby="artificial-intelligence-title"
>
  <div class="section__shell">
    <header class="section__intro">
      <div class="section__title-group">
        <div class="section__title-lockup">
          <h3 id="artificial-intelligence-title" tabindex="-1">
            {{ localize(content().title) }}
          </h3>
        </div>
      </div>
      <p class="section__lead">{{ localize(content().introduction) }}</p>
    </header>

    <ul class="section__body ai-list">
      @for (card of content().cards; track card.id) {
        <li data-reveal-block>
          <a class="ai-card card-motion" [routerLink]="card.path" [queryParams]="queryParams()">
            <div class="ai-card__content">
              <p class="ai-card__label">{{ localize(card.label) }}</p>
              <h4>{{ localize(card.title) }}</h4>
              <p>{{ localize(card.description) }}</p>
            </div>
            <span class="ai-card__link">
              {{ localize(card.actionLabel) }}
              <span aria-hidden="true">→</span>
            </span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
