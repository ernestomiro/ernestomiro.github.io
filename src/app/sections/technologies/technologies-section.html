<section
  id="technologies"
  class="section section--collection section--surface-warm section--chapter-member"
  aria-labelledby="technologies-title"
>
  <div class="section__shell">
    <header class="section__intro">
      <div class="section__title-group">
        <div class="section__title-lockup">
          <h3 id="technologies-title" tabindex="-1">
            {{ localize(content().title) }}
          </h3>
          <span class="section__title-line" aria-hidden="true"></span>
        </div>
      </div>
      <p class="section__lead">{{ localize(content().introduction) }}</p>
    </header>

    <div class="section__body technology-groups">
      @for (group of content().groups; track group.id) {
        <section class="technology-group" [attr.aria-labelledby]="group.id + '-title'">
          <h4 [id]="group.id + '-title'">{{ localize(group.label) }}</h4>
          <ul>
            @for (technology of group.items; track technology) {
              <li>{{ technology }}</li>
            }
          </ul>
        </section>
      }
    </div>
  </div>
</section>
