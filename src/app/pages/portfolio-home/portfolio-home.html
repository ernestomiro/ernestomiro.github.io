<main
  id="main-content"
  class="portfolio-home"
  tabindex="-1"
  appSectionReveal
  appSectionDepth
  data-depth-group="profile"
>
  <div class="portfolio-home__ambient" aria-hidden="true">
    <span
      class="portfolio-home__ambient-layer portfolio-home__ambient-layer--profile"
    ></span>
    <span
      class="portfolio-home__ambient-layer portfolio-home__ambient-layer--evidence"
    ></span>
    <span
      class="portfolio-home__ambient-layer portfolio-home__ambient-layer--contact"
    ></span>
  </div>

  <app-hero-section [content]="heroContent" />
  <app-about-section [content]="aboutContent" />
  <app-services-section [content]="servicesContent" />
  <app-projects-section [content]="projectsContent" />
  <app-experience-section [content]="experienceContent" />

  <section
    id="capabilities"
    class="portfolio-home__capabilities"
    aria-labelledby="capabilities-title"
  >
    <header class="section__intro portfolio-home__capabilities-header">
      <div class="layout-shell">
        <div class="section__title-lockup">
          <h2 id="capabilities-title" tabindex="-1">
            {{ localize(capabilitiesContent.title) }}
          </h2>
          <span class="section__title-line" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <app-expertise-section
      [content]="expertiseContent"
      [methodology]="methodologyTeaser"
    />
    <app-technologies-section [content]="technologiesContent" />
  </section>

  <app-contact-section [content]="contactContent" />
</main>
